# .cargo/mutants.toml — cargo-mutants recipe for CodeImpact's [[test]]-crate
# layout (#114). Read automatically by ANY `cargo mutants` invocation from
# the workspace root -- this is the canonical default config location
# (see cargo-mutants' own book, "Config file") -- so this file governs both
# `scripts/mutation.sh` and `mutation_gate.py`'s direct subprocess call
# alike, with zero extra flags required on either caller's side.
#
# THE TRAP: every test lives in a separate `[[test]]` binary crate
# (hexagon.unit_test, secondaries.integration_test, primaries.e2e_test),
# each declaring `[lib] test = false` in its own Cargo.toml. Left
# unconfigured, `cargo mutants` mutates one of codeimpact_hexagon /
# _secondaries / _primaries and by default runs ONLY that package's own
# tests via `cargo test -p <package>` -- which range from partial (a
# handful of in-lib `#[cfg(test)]` modules survive in codeimpact_hexagon
# alongside the external crate, e.g. code_location.rs,
# complexity_detector.rs) to genuinely empty (codeimpact_secondaries,
# codeimpact_primaries have no in-lib tests at all; every behavior is
# exercised only via the external [[test]] crates). Either shape is a
# vacuous-pass risk: a mutant survives not because the behavior is
# untested, but because the tests that WOULD catch it live in a sibling
# package cargo-mutants never runs.
#
# THE FIX: `test_workspace = true` makes cargo-mutants run
# `cargo test --workspace` for the baseline AND for every mutant,
# regardless of which package was mutated -- so hexagon.unit_test,
# secondaries.integration_test and primaries.e2e_test are always in scope.
# This is the one config key that closes the trap; see
# `~/.claude/knowledge-base/tests/mutation-testing.md` and
# https://mutants.rs (book: "Workspace and package support").
test_workspace = true

# Package selection is untouched (default virtual-workspace heuristic: no
# `default-members` in the root Cargo.toml, no `-p`/`--workspace` flag from
# either caller -> every workspace member is a mutation candidate,
# including the three [[test]] crates themselves). `exclude_globs` closes
# that gap directly at the file level instead: nothing under
# `tests/` is production code, so nothing there should ever be mutated --
# regardless of how `cargo mutants` is invoked, and without touching the
# workspace's package/member list at all.
exclude_globs = ["src/contexts/codeimpact/tests/**"]
